[project]
name = "courtside"
version = "0.1.0"
description = "Courtside AI — NBA player prop research engine (Phase 1 MVP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "apscheduler>=3.10,<4",
  "python-dateutil>=2.9",
  "tzdata",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
courtside = "courtside.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
